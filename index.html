<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self';">
    <title>Guess The Number Game</title>
    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Mode Selection Screen -->
      <div id="mode-selection" class="mode-screen">
        <h3>Select Game Mode</h3>
        <div class="mode-buttons">
          <button id="single-player-btn" class="mode-btn">
            <i class="fa-solid fa-user"></i>
            <br>Single Player
          </button>
          <button id="two-player-btn" class="mode-btn">
            <i class="fa-solid fa-users"></i>
            <br>Two Player
          </button>
        </div>
      </div>

      <!-- Game Screen -->
      <div id="game" class="game-screen" style="display: none;">
        <h3 id="game-title">
          Hey there!<br/>
          I have chosen a number between 1 - 100.<br />
          Can you try to guess it?
        </h3>
        <div id="current-player" style="display: none; margin-bottom: 1.5em;"></div>
        <div class="input-wrapper">
          <input type="number" placeholder="00" id="guess" />
          <button id="check-btn">Guess</button>
        </div>
        <p id="no-of-guesses">No. Of Guesses: 0</p>
        <p id="guessed-nums">Guessed Numbers are: None</p>
        <!-- Two Player Stats -->
        <div id="two-player-stats" style="display: none; margin-top: 2em;">
          <div class="stats-container">
            <div class="player-card player-1-card">
              <div class="player-header">
                <i class="fa-solid fa-user-circle"></i>
                <h4>Player 1</h4>
              </div>
              <div class="player-info">
                <div class="stat-row">
                  <span class="stat-label">Guesses:</span>
                  <span id="player1-guesses" class="stat-value">0</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">Numbers:</span>
                  <span id="player1-numbers" class="stat-value">None</span>
                </div>
              </div>
            </div>

            <div class="player-card player-2-card">
              <div class="player-header">
                <i class="fa-solid fa-user-circle"></i>
                <h4>Player 2</h4>
              </div>
              <div class="player-info">
                <div class="stat-row">
                  <span class="stat-label">Guesses:</span>
                  <span id="player2-guesses" class="stat-value">0</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">Numbers:</span>
                  <span id="player2-numbers" class="stat-value">None</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <button id="restart">Restart<i class="fa-solid fa-arrow-rotate-left"></i></button>
      <button id="reveal-answer" style="display: none;">Reveal Answer</button>
      <div class="result">
        <div id="hint"></div>
      </div>
    </div>
    <!-- Script -->
    <script src="script.js"></script>
  </body>
</html>
